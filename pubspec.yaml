name: navguide
description: A Smart Campus Navigation App for the University of Energy and Natural Resources (UENR).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase dependencies
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0

  # Location and Maps
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Networking
  http: ^1.2.0

  # State management
  provider: ^6.1.2

  # UI / UX
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.8
  lottie: ^3.1.0
  url_launcher: ^6.3.1

  # Utilities
  shared_preferences: ^2.5.2
  intl: ^0.20.0
  uuid: ^4.5.1
  permission_handler: ^12.0.1
  connectivity_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/ic_launcher.png"
  adaptive_icon_background: "#4b77d6"
  adaptive_icon_foreground: "assets/icons/ic_launcher.png"
  min_sdk_android: 21