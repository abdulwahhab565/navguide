<!DOCTYPE html>
<html>

<head>
  <!--
    NavGuide – UENR Smart Campus Navigation
    Web entry point for Flutter Web build.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
        content="NavGuide — Smart Campus Navigation for the University of Energy and Natural Resources (UENR), Sunyani, Ghana.">
  <meta name="keywords" content="UENR, campus navigation, smart campus, Sunyani, Ghana, university map">
  <meta name="author" content="UENR CSC Final Year Project">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA / icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NavGuide">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>NavGuide – UENR Campus Navigation</title>

  <!-- Google Maps JavaScript API for web platform -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCpMjOU83HIUWrZVG46mDf4p7I3Z4nxXrE"></script>

  <link rel="manifest" href="manifest.json">

  <!-- Page loading style - MATCHES YOUR APP THEME -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0A0E1A;
      /* ⭐ AppTheme.surface */
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Roboto', sans-serif;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .loader-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #6C5CE7, #00F3FF);
      /* ⭐ Purple to Neon Cyan */
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(108, 92, 231, 0.4);
      /* ⭐ AppTheme.primary with opacity */
      animation: pulse 1.5s ease-in-out infinite;
    }

    .loader-icon svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid rgba(0, 243, 255, 0.2);
      /* ⭐ AppTheme.primaryLight with opacity */
      border-top-color: #00F3FF;
      /* ⭐ AppTheme.primaryLight */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 30px rgba(108, 92, 231, 0.4);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 0 45px rgba(108, 92, 231, 0.6);
      }
    }
  </style>
</head>

<body>
<!-- Shown before Flutter engine loads -->
<div id="loading">
  <div class="loader-icon">
    <!-- Navigation arrow SVG -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" />
    </svg>
  </div>
  <div class="spinner"></div>
  <span>Loading NavGuide…</span>
</div>

<script>
  // Remove splash when Flutter renders its first frame
  window.addEventListener('flutter-first-frame', function() {
    var loading = document.getElementById('loading');
    if (loading) {
      loading.style.opacity = '0';
      loading.style.transition = 'opacity 0.4s ease';
      setTimeout(function() { loading.remove(); }, 400);
    }
  });
</script>

<script src="flutter_bootstrap.js" async></script>
</body>

</html>
